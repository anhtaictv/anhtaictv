<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" font-family="'Segoe UI','Be Vietnam Pro',Ubuntu,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151d"/>
      <stop offset="1" stop-color="#1c1410"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#e2452a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#f0592a" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f0592a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity=".07"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font-size:46px;font-weight:700;fill:#ffffff;letter-spacing:.5px}
    .role{font-size:15px;font-weight:600;fill:#ff8a3d;letter-spacing:2.5px}
    .tag{font-size:19px;font-style:italic;fill:#c9d1d9}
    .chip{font-size:13.5px;font-weight:600;fill:#e6edf3}
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#dots)"/>
    <rect width="900" height="260" fill="url(#glow)"/>
    <g fill="url(#accent)" opacity=".55" transform="translate(690,70)">
      <rect x="0"   y="44" width="8" height="32" rx="4"/>
      <rect x="18"  y="24" width="8" height="72" rx="4"/>
      <rect x="36"  y="8"  width="8" height="104" rx="4"/>
      <rect x="54"  y="30" width="8" height="60" rx="4"/>
      <rect x="72"  y="0"  width="8" height="120" rx="4"/>
      <rect x="90"  y="20" width="8" height="80" rx="4"/>
      <rect x="108" y="38" width="8" height="44" rx="4"/>
      <rect x="126" y="14" width="8" height="92" rx="4"/>
      <rect x="144" y="46" width="8" height="28" rx="4"/>
    </g>
    <rect x="0" y="0" width="6" height="260" fill="url(#accent)"/>
  </g>
  <rect x=".5" y=".5" width="899" height="259" rx="18" fill="none" stroke="#f0592a" stroke-opacity=".35"/>

  <text class="role" x="52" y="62">FULL-STACK DEVELOPER · MÈO SOFTWARE</text>
  <text class="name" x="50" y="118">Tạ Anh Tài</text>
  <rect x="52" y="134" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text class="tag" x="52" y="172">Xây dựng phần mềm gọn nhẹ, dễ dùng — giải quyết đúng bài toán thực tế.</text>

  <g transform="translate(52,196)">
    <rect width="92" height="30" rx="15" fill="#f0592a" fill-opacity=".16" stroke="#f0592a" stroke-opacity=".5"/>
    <text class="chip" x="46" y="20" text-anchor="middle">Web app</text>
    <g transform="translate(104,0)">
      <rect width="160" height="30" rx="15" fill="#f0592a" fill-opacity=".16" stroke="#f0592a" stroke-opacity=".5"/>
      <text class="chip" x="80" y="20" text-anchor="middle">AI cho tiếng Việt</text>
    </g>
    <g transform="translate(276,0)">
      <rect width="160" height="30" rx="15" fill="#f0592a" fill-opacity=".16" stroke="#f0592a" stroke-opacity=".5"/>
      <text class="chip" x="80" y="20" text-anchor="middle">Thị giác máy tính</text>
    </g>
    <g transform="translate(448,0)">
      <rect width="176" height="30" rx="15" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <path transform="translate(16,7)" fill="#ff8a3d" d="M6 0a6 6 0 0 0-6 6c0 4.5 6 10 6 10s6-5.5 6-10a6 6 0 0 0-6-6zm0 8.2A2.2 2.2 0 1 1 6 3.8a2.2 2.2 0 0 1 0 4.4z"/>
      <text class="chip" x="98" y="20" text-anchor="middle">Đắk Lắk, Việt Nam</text>
    </g>
  </g>
</svg>
